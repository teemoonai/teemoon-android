org.gradle.jvmargs=-Xmx4g -XX:+UseParallelGC
org.gradle.caching=true
org.gradle.configuration-cache=true
android.useAndroidX=true
kotlin.code.style=official

# A connected run LEAVES THE APK INSTALLED. AGP's default uninstalls it afterwards, and Android deletes the app's
# external files with it — which is where RouteCrawlTest writes its screenshots. The first crawl produced fifteen
# and then deleted all fifteen before anyone could look at them.
#
# It is also the behaviour that wiped the developer's Pixel on 2026-09-17: a connected run against a real phone
# uninstalls the app it just tested, and takes the chats and the downloaded model weights with it. Leaving the APK
# installed is the safe direction on both counts. Suites still belong on the AVD or the lab — this makes the
# default less destructive, it does not make a phone a test device.
android.injected.androidTest.leaveApksInstalledAfterRun=true
