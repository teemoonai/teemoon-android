# CONFIRMED BY BUILD (2026-08-23): `./gradlew test` is green on Gradle 9.7.1 /
# JDK 17 / compileSdk 35, so every version here resolves as declared.
#
# What that does NOT prove: nothing imports these libraries yet. A version can
# resolve and still be wrong at the first real `import okhttp3` or Room
# @Database in Phase 2. Treat the first module port as the actual test.
#
# Learned by failing: from Kotlin 2.0 on, enabling Compose requires the Compose
# Compiler Gradle plugin. Omitting it fails configuration of :app outright.
#
# The four spike-gated artifacts are absent by design, not oversight:
# dcap-qvl-android (S1), litertlm-android (S2), a markdown renderer (S3), and
# the libsodium binding (S4). §11 says resolve the spike, do not guess.
#
# Adding anything here that is not on CONTRIBUTING.md's allowlist requires
# justification in the PR. Forbidden outright: Firebase, any analytics or
# crash SDK, Retrofit, okhttp-sse, Hilt/Dagger/Koin.

[versions]
agp = "9.4.0"
kotlin = "2.4.10"
composeBom = "2026.08.00"
coreKtx = "1.19.0"
lifecycle = "2.11.0"
activityCompose = "1.13.0"
navigationCompose = "2.10.0"
okhttp = "5.5.0"
serialization = "1.11.0"
room = "2.8.4"
ksp = "2.3.11"   # KSP2: no longer tied to the Kotlin version
coil = "2.7.0"
bouncycastle = "1.85.2"
secp256k1 = "0.24.0"
junit = "4.13.2"
androidxTestJunit = "1.3.0"
androidxTestRunner = "1.7.0"
dcapQvl = "0.5.2"   # coordinated pin with iOS dcap-qvl-swift 0.5.2 (S1)
kotlinxCoroutinesTest = "1.11.0"
paparazzi = "2.0.0-alpha05"

[libraries]
androidx-core-ktx = { module = "androidx.core:core-ktx", version.ref = "coreKtx" }
androidx-lifecycle-viewmodel-compose = { module = "androidx.lifecycle:lifecycle-viewmodel-compose", version.ref = "lifecycle" }
androidx-lifecycle-runtime-compose = { module = "androidx.lifecycle:lifecycle-runtime-compose", version.ref = "lifecycle" }
androidx-lifecycle-runtime = { module = "androidx.lifecycle:lifecycle-runtime-ktx", version.ref = "lifecycle" }
androidx-activity-compose = { module = "androidx.activity:activity-compose", version.ref = "activityCompose" }
androidx-navigation-compose = { module = "androidx.navigation:navigation-compose", version.ref = "navigationCompose" }
compose-bom = { module = "androidx.compose:compose-bom", version.ref = "composeBom" }
compose-ui = { module = "androidx.compose.ui:ui" }
compose-material3 = { module = "androidx.compose.material3:material3" }
compose-material-icons-core = { module = "androidx.compose.material:material-icons-core" }
markdown-renderer-m3 = { module = "com.mikepenz:multiplatform-markdown-renderer-m3", version = "0.45.0" }
compose-ui-tooling-preview = { module = "androidx.compose.ui:ui-tooling-preview" }
okhttp = { module = "com.squareup.okhttp3:okhttp", version.ref = "okhttp" }
kotlinx-serialization-json = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json", version.ref = "serialization" }
kotlinx-coroutines-core = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-core", version.ref = "kotlinxCoroutinesTest" }
kotlinx-coroutines-test = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-test", version.ref = "kotlinxCoroutinesTest" }
room-runtime = { module = "androidx.room:room-runtime", version.ref = "room" }
room-ktx = { module = "androidx.room:room-ktx", version.ref = "room" }
room-compiler = { module = "androidx.room:room-compiler", version.ref = "room" }
room-testing = { module = "androidx.room:room-testing", version.ref = "room" }
# FTS5 is NOT guaranteed by the platform SQLite (absent on the API 34 ATD image); the bundled engine has it everywhere.
androidx-sqlite-bundled = { module = "androidx.sqlite:sqlite-bundled", version = "2.7.0" }
# Test-only: runs the chat-search FTS5 SQL on the JVM. Android uses the platform SQLite (see ChatSearchIndex).
sqlite-jdbc = { module = "org.xerial:sqlite-jdbc", version = "3.53.4.0" }
coil-compose = { module = "io.coil-kt:coil-compose", version.ref = "coil" }
bouncycastle = { module = "org.bouncycastle:bcprov-jdk18on", version.ref = "bouncycastle" }
secp256k1-kmp = { module = "fr.acinq.secp256k1:secp256k1-kmp-jni-android", version.ref = "secp256k1" }
junit = { module = "junit:junit", version.ref = "junit" }
androidx-test-junit = { module = "androidx.test.ext:junit", version.ref = "androidxTestJunit" }
androidx-test-runner = { module = "androidx.test:runner", version.ref = "androidxTestRunner" }
compose-ui-test-junit4 = { module = "androidx.compose.ui:ui-test-junit4" }
# Test only. ui-test 1.12 transitively pulls Espresso 3.5.0, whose input injection calls InputManager.getInstance —
# removed in Android 17 — so every Compose device test died on the Pixel 10 Pro before it started. 3.7.0 fixes it.
androidx-test-espresso-core = { module = "androidx.test.espresso:espresso-core", version = "3.7.0" }
compose-ui-test-manifest = { module = "androidx.compose.ui:ui-test-manifest" }
dcap-qvl-android = { module = "com.phala:dcap-qvl-android", version.ref = "dcapQvl" }

# S2 resolved 2026-09-03 at 0.16.1; 2026-10-14 0.18.0, which pins LiteRT ~2.3.0 — the vendored libLiteRt and NPU dispatchers
# (ondevice/src/main/jniLibs) move with it: 2.3.0 added `get_hooks` to LiteRtDispatchInterface, so a 2.2.0 dispatcher does not fit.
# The Swift side vendors the 0.14-era wrapper.
litertlm-android = { module = "com.google.ai.edge.litertlm:litertlm-android", version = "0.18.0" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
android-library = { id = "com.android.library", version.ref = "agp" }
kotlin-android = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
# Required whenever compose is enabled, from Kotlin 2.0 on. Versioned with
# the Kotlin plugin, not independently.
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
paparazzi = { id = "app.cash.paparazzi", version.ref = "paparazzi" }
ksp = { id = "com.google.devtools.ksp", version.ref = "ksp" }
